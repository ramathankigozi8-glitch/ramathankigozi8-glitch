name: Update README

on:
  # Runs automatically every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Runs every time you push to the main branch
  push:
    branches: [ main, master ]
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update README with recent repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: auto-update recent repositories [skip ci]"
          git push
